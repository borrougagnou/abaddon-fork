name: Build Debian and RPM Packages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y \
            git \
            cmake \
            make \
            g++ \
            pkg-config \
            libgtkmm-3.0-dev \
            libcurl4-gnutls-dev \
            libsqlite3-dev \
            libhandy-1-dev \
            libsecret-1-dev \
            libopus-dev \
            libsodium-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libssl-dev

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0
          ref: package-create

      # TODO REMOVE REF: PACKAGE-CREATE ABOVE !!!

      - name: Build application
        run: |
          # CMAKE_INSTALL_PREFIX: https://github.com/uowuo/abaddon/commit/bf06e89d50e624e36dbbb6757260e5d0d758b4be
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -C build -j$(nproc)


      - name: Create package structure
        run: |
          #mkdir -p debian-pkg/{usr/share/abaddon,usr/bin,usr/share/applications,usr/share/icons/hicolor/scalable/apps,DEBIAN}

          # Install binary
          mkdir -p debian-pkg/usr/share/abaddon debian-pkg/usr/bin
          cp build/abaddon debian-pkg/usr/share/abaddon/abaddon
          chmod 755 debian-pkg/usr/share/abaddon/abaddon
          ln -s /usr/share/abaddon/abaddon debian-pkg/usr/bin/abaddon

          # Copy resources if they exist
          [ -d res/css ]   && cp -r res/css   debian-pkg/usr/share/abaddon/
          [ -d res/res ]   && cp -r res/res   debian-pkg/usr/share/abaddon/
          [ -d res/fonts ] && cp -r res/fonts debian-pkg/usr/share/abaddon/

          # Install desktop file and icon
          mkdir -p debian-pkg/usr/share/abaddon debian-pkg/usr/share/applications debian-pkg/usr/share/icons/hicolor/scalable/apps
          cp res/desktop/io.github.uowuo.abaddon.desktop debian-pkg/usr/share/abaddon/abaddon.desktop
          ln -s /usr/share/abaddon/abaddon.desktop debian-pkg/usr/share/applications/abaddon.desktop
          cp res/desktop/icon.svg debian-pkg/usr/share/icons/hicolor/scalable/apps/abaddon.svg

      - name: Disable git ownership check
        run: |
          git config --global --add safe.directory '*'

      - name: Get version from git
        id: version
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif git describe --tags 2>/dev/null; then
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//' | sed 's/-/./g').git$(git rev-parse --short HEAD)"
          else
            VERSION="0.0.0.git$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      #- name: Get version from git
      #  id: version
      #  run: |
      #    if git describe --tags --exact-match 2>/dev/null; then
      #      VERSION=${GITHUB_REF#refs/tags/v}
      #    elif git describe --tags 2>/dev/null; then
      #      VERSION=$(git describe --tags | sed 's/^v//')
      #    else
      #      VERSION="0.0.0+git$(git rev-parse --short HEAD)"
      #    fi
      #    echo "version=$VERSION" >> $GITHUB_OUTPUT
      #    echo "Package version: $VERSION"

      - name: Get size from git
        id: size
        run: |
          PKGSIZE=$(du -s ${PWD}/debian-pkg/usr | awk '{print $1}')
          echo "size=$PKGSIZE" >> $GITHUB_OUTPUT
          echo "Package Size: $PKGSIZE"

      - name: Create Debian package structure
        run: |
          mkdir -p debian-pkg/DEBIAN

          # to debug if needed:
          # g++ cmake libgtkmm-3.0-dev libcurl4-gnutls-dev libsqlite3-dev libssl-dev nlohmann-json3-dev libhandy-1-dev libsecret-1-dev libopus-dev libsodium-dev libspdlog-dev

          # Depends: libgtkmm-3.0-1v5, libcurl4-gnutls-dev, libsqlite3-0, libhandy-1-0, libsecret-1-0, libopus0, libsodium23, libspdlog1
          # Recommends: nlohmann-json3-dev, libssl3

          # Create control file
          cat > debian-pkg/DEBIAN/control << 'EOF'
          Package: abaddon
          Version: ${{ steps.version.outputs.version }}
          Architecture: amd64
          Maintainer: Abaddon Team <ouwou@github.com>
          Installed-Size: ${{ steps.size.outputs.size }}
          Depends: libgtkmm-3.0-1v5, libhandy-1-0, libcurl4, libssl3 | libssl1.1, libopus0, libopusfile0, libsqlite3-0, libsecret-1-0, libasound2, libpulse0
          Section: net
          Priority: optional
          Homepage: https://github.com/uowuo/abaddon
          Description: GTK-based Discord client
           Abaddon is a Discord client written in C++ with GTK.
           Features include:
            - Voice and text chat support
            - Rich media rendering
            - Modern GTK interface
            - Native Linux integration
          EOF

          # Kill processes before install/upgrade
          cat > debian-pkg/DEBIAN/preinst << 'EOF'
          #!/bin/bash
          set -e
          if pgrep -x "abaddon" >/dev/null 2>&1; then
            echo "Stopping Abaddon..."
            pkill -TERM "abaddon" || true
            sleep 2
            pgrep -x "abaddon" >/dev/null 2>&1 && pkill -KILL "abaddon" || true
          fi
          exit 0
          EOF
          chmod 755 debian-pkg/DEBIAN/preinst

          # Update databases after install
          cat > debian-pkg/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          if [ "$1" = "configure" ]; then
            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
            fi
            if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
            fi
          fi
          exit 0
          EOF
          chmod 755 debian-pkg/DEBIAN/postinst

          # Kill before removal
          cat > debian-pkg/DEBIAN/prerm << 'EOF'
          #!/bin/bash
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "upgrade" ]; then
            pgrep -x "abaddon" >/dev/null 2>&1 && { pkill -TERM "abaddon" || true; sleep 2; pkill -KILL "abaddon" 2>/dev/null || true; }
          fi
          exit 0
          EOF
          chmod 755 debian-pkg/DEBIAN/prerm

          # Cleanup databases after removal
          cat > debian-pkg/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          set -e
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
            if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
            fi
            if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
            fi
          fi
          exit 0
          EOF
          chmod 755 debian-pkg/DEBIAN/postrm

      - name: Build Debian package
        run: |
          dpkg-deb --build debian-pkg abaddon_${{ steps.version.outputs.version }}_amd64.deb

      - name: Verify Debian package
        run: |
          dpkg-deb --info abaddon_${{ steps.version.outputs.version }}_amd64.deb
          dpkg-deb --contents abaddon_${{ steps.version.outputs.version }}_amd64.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: abaddon_*.deb
          retention-days: 30


  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container: fedora:39

    steps:
      - name: Install RPM build dependencies
        run: |
          dnf install -y \
            git \
            cmake \
            make \
            gcc-c++ \
            pkg-config \
            rpm-build \
            rpmdevtools \
            gtkmm30-devel \
            libhandy-devel \
            libcurl-devel \
            sqlite-devel \
            libsecret-devel \
            opus-devel \
            libsodium-devel \
            spdlog-devel \
            json-devel \
            openssl-devel

        #run: |
        #  dnf install -y \
        #    meson \
        #    ninja-build \
        #    gcc \
        #    gcc-c++ \
        #    pkg-config \
        #    rpm-build \
        #    rpmdevtools \
        #    git \
        #    gtkmm30-devel \
        #    libhandy-devel \
        #    libcurl-devel \
        #    openssl-devel \
        #    opus-devel \
        #    opusfile-devel \
        #    json-devel \
        #    sqlite-devel \
        #    libsecret-devel \
        #    alsa-lib-devel \
        #    pulseaudio-libs-devel \
        #    cairo-devel \
        #    pango-devel \
        #    glib2-devel


      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0
          ref: package-create

      # TODO REMOVE REF: PACKAGE-CREATE ABOVE !!!

      - name: Build application
        run: |
          # CMAKE_INSTALL_PREFIX: https://github.com/uowuo/abaddon/commit/bf06e89d50e624e36dbbb6757260e5d0d758b4be
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          make -C build -j$(nproc)

      - name: Disable git ownership check
        run: |
          git config --global --add safe.directory '*'

      - name: Get version from git
        id: version
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif git describe --tags 2>/dev/null; then
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//' | sed 's/-/./g').git$(git rev-parse --short HEAD)"
          else
            VERSION="0.0.0.git$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Setup RPM build environment
        run: |
          rpmdev-setuptree
          mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/RPMS ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/SRPMS

      - name: Create source tarball
        run: |
          git archive --format=tar.gz --prefix=abaddon-${{ steps.version.outputs.version }}/ \
            -o ~/rpmbuild/SOURCES/abaddon-${{ steps.version.outputs.version }}.tar.gz HEAD

      - name: Create RPM spec file
        run: |
          cat > ~/rpmbuild/SPECS/abaddon.spec << 'EOF'
          Name:           abaddon
          Version:        ${{ steps.version.outputs.version }}
          Release:        1%{?dist}
          Summary:        GTK-based Discord client

          License:        GPL-3.0
          URL:            https://github.com/uowuo/abaddon
          Source0:        %{name}-%{version}.tar.gz

          BuildRequires:  cmake make gcc-c++ pkgconfig git
          BuildRequires:  gtkmm30-devel libhandy-devel libcurl-devel
          BuildRequires:  sqlite-devel libsecret-devel opus-devel
          BuildRequires:  libsodium-devel spdlog-devel json-devel openssl-devel

          Requires:       gtkmm30 libhandy libcurl sqlite-libs
          Requires:       libsecret opus libsodium spdlog
          Recommends:     openssl-libs

          %description
          Abaddon is a Discord client written in C++ with GTK.
          Features include voice and text chat support, rich media
          rendering, modern GTK interface, and native Linux integration.

          %prep
          %autosetup -n %{name}-%{version}

          %build
          %cmake -DCMAKE_BUILD_TYPE=Release
          %cmake_build

          %install
          mkdir -p %{buildroot}/{usr/share/abaddon,usr/bin,usr/share/applications,usr/share/icons/hicolor/scalable/apps}
          install -Dm755 %{_vpath_builddir}/abaddon %{buildroot}/usr/share/abaddon/abaddon
          ln -s /usr/share/abaddon/abaddon %{buildroot}/usr/bin/abaddon
          install -Dm644 res/desktop/io.github.uowuo.abaddon.desktop %{buildroot}/usr/share/abaddon/abaddon.desktop
          ln -s /usr/share/abaddon/abaddon.desktop %{buildroot}/usr/share/applications/abaddon.desktop
          install -Dm644 res/desktop/icon.svg %{buildroot}/usr/share/icons/hicolor/scalable/apps/abaddon.svg

          %pre
          pgrep -x "abaddon" >/dev/null 2>&1 && { pkill -TERM "abaddon" || true; sleep 2; pkill -KILL "abaddon" 2>/dev/null || true; }
          exit 0

          %post
          /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || :
          /usr/bin/gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || :

          %preun
          [ "$1" -eq 0 ] && pgrep -x "abaddon" >/dev/null 2>&1 && { pkill -TERM "abaddon" || true; sleep 2; pkill -KILL "abaddon" 2>/dev/null || true; }
          exit 0

          %postun
          /usr/bin/update-desktop-database -q /usr/share/applications 2>/dev/null || :
          /usr/bin/gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || :

          %files
          %{_bindir}/abaddon
          %{_datadir}/applications/*.desktop
          %{_datadir}/icons/hicolor/*/apps/*
          %{_datadir}/metainfo/*.appdata.xml
          %doc README.md
          %license LICENSE
          EOF

      - name: Build RPM package
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/abaddon.spec

      - name: Copy RPM to workspace
        run: |
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} rpms/ \;

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpms/*.rpm
          retention-days: 30

  create-release:
    name: Create Release
    needs: [build-debian, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Debian package from artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: packages/

      - name: Download RPM package from artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-package
          path: packages/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

